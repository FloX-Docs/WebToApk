name: Build APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL Target'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      filename:
        description: 'Nama File APK'
        required: true
      icon_b64:
        description: 'Icon (Base64)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          cd builder # Sesuaikan path jika perlu
          npm install

      - name: Run Builder Script
        env:
          WEBSITE_URL: ${{ github.event.inputs.website_url }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          FILENAME: ${{ github.event.inputs.filename }}
          ICON_B64: ${{ github.event.inputs.icon_b64 }}
        run: |
          cd builder # Sesuaikan path jika perlu
          node build.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: builder/output/releases/*.apk # Sesuaikan dengan output path build.js lu
