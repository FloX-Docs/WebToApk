plugins {
    id 'com.android.application'
}

android {

    namespace 'com.flox.web2apk'

    compileSdk 35

    defaultConfig {

        applicationId 'com.flox.web2apk'

        minSdk 23

        targetSdk 35

        versionCode 1

        versionName '1.0'
    }

    buildTypes {

        release {

            minifyEnabled false

            shrinkResources false

        }
    }
}
